<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-os-theme="dark">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Operating Swarm{% endblock %}</title>
    {% include "includes/brand_icons.html" %}
    <link href="{% static 'contrib/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/rest_mode_style.css' %}" rel="stylesheet">
    <link href="{% static 'css/dropdown.css' %}" rel="stylesheet">
    <link href="{% static 'css/operator.css' %}" rel="stylesheet">
    <script src="{% static 'contrib/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>
    {# External: avoid HTMX <style> inject under style-src 'self' (see htmx_csp.js). #}
    <script src="{% static 'js/htmx_csp.js' %}"></script>
    <link rel="stylesheet" href="{% static 'contrib/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'contrib/prism/prism-tomorrow.min.css' %}">
    <script defer src="{% static 'contrib/prism/prism.min.js' %}"></script>
    <script defer src="{% static 'contrib/prism/prism-python.min.js' %}"></script>
    <script src="{% static 'js/chrome_theme.js' %}"></script>
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="os-app">
    {% csrf_token %}
    <a class="visually-hidden-focusable btn btn-sm btn-primary position-absolute top-0 start-0 m-2 z-3" href="#os-main">Skip to main content</a>
    {% with path=request.path %}
    <header class="os-header sticky-top">
        <nav class="navbar navbar-dark os-navbar py-1" aria-label="Primary">
            <div class="os-navbar-inner">
                <button type="button" class="os-sidebar-toggle d-lg-none" id="os-sidebar-open" aria-label="Open agents sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <a class="navbar-brand fw-semibold" href="/" aria-label="Home"><img src="{% static 'brand/webui-geometric.svg' %}" alt="" width="28" height="28" class="os-brand-mark-geometric"></a>
                <ul class="navbar-nav flex-row flex-nowrap align-items-center gap-1 me-auto mb-0">
                    <li class="nav-item">
                        <a class="nav-link {% if path == '/agents' or path|slice:':8' == '/agents/' %}active{% endif %}"
                           href="/agents"
                           {% if path == '/agents' or path|slice:':8' == '/agents/' %}aria-current="page"{% endif %}>Agents</a>
                    </li>
                </ul>
                <ul class="navbar-nav flex-row flex-nowrap align-items-center gap-1 ms-auto mb-0">
                    <li class="nav-item">
                        <button type="button" class="os-theme-toggle nav-link" id="os-theme-toggle"
                                aria-label="Switch to light theme">Light</button>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle {% if path == '/chat' or path|slice:':6' == '/chat/' or '/blueprint' in path or path|slice:':7' == '/teams/' or path|slice:':10' == '/sessions/' or path|slice:':10' == '/settings/' or path|slice:':10' == '/profiles/' %}active{% endif %}"
                           href="#" id="moreNavDropdown" role="button" data-bs-toggle="dropdown"
                           data-bs-display="static" aria-expanded="false" aria-haspopup="true">More</a>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="moreNavDropdown">
                            <li>
                                <a class="dropdown-item {% if path == '/chat' or path|slice:':6' == '/chat/' %}active{% endif %}"
                                   href="/chat">Chat</a>
                            </li>
                            <li>
                                <a class="dropdown-item {% if '/blueprint' in path or '/agent-creator' in path or '/team-creator' in path %}active{% endif %}"
                                   href="/blueprint-library/">Blueprints</a>
                            </li>
                            <li>
                                <a class="dropdown-item {% if path|slice:':7' == '/teams/' %}active{% endif %}"
                                   href="/teams/launch/">Teams</a>
                            </li>
                            <li>
                                <a class="dropdown-item {% if path|slice:':10' == '/sessions/' %}active{% endif %}"
                                   href="/sessions/">Sessions</a>
                            </li>
                            <li>
                                <a class="dropdown-item {% if path|slice:':10' == '/settings/' or path|slice:':10' == '/profiles/' %}active{% endif %}"
                                   href="/settings/">Settings</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" href="https://github.com/matthewhand/open-swarm"
                                   target="_blank" rel="noopener noreferrer">GitHub</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <div id="os-agent-pin-grid" class="os-agent-pin-grid is-empty" aria-label="Pinned agents"></div>
    </header>
    {% endwith %}

    <div class="os-shell">
        <button type="button" class="os-sidebar-backdrop" id="os-sidebar-backdrop" hidden aria-label="Close agents sidebar"></button>
        <aside class="os-agent-sidebar" id="os-agent-sidebar" aria-label="Agents">
            <div class="os-agent-sidebar__head d-lg-none">
                <button type="button" class="os-sidebar-close" id="os-sidebar-close" aria-label="Close agents sidebar">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="os-agent-sidebar__search">
                <label class="visually-hidden" for="os-agent-filter">Filter agents</label>
                <input id="os-agent-filter" type="search" class="os-agent-filter" placeholder="Search agents" autocomplete="off">
            </div>
            <nav class="os-agent-sidebar__list" aria-label="Agent list">
                <p class="os-agent-status" id="os-agent-status">Loading agents…</p>
                <ul class="os-agent-ul" id="os-agent-list"></ul>
                <div class="os-agent-hidden" id="os-agent-hidden-wrap" hidden>
                    <button type="button" class="os-agent-hidden__toggle os-hidden-bots-row" id="os-agent-hidden-toggle" aria-expanded="false" aria-label="Hidden Bots">
                        <span class="os-hidden-bots-label">Hidden Bots</span>
                        <span class="os-hidden-bots-tail" id="os-agent-hidden-count">0</span>
                    </button>
                    <ul class="os-agent-ul" id="os-agent-hidden-list" hidden></ul>
                </div>
            </nav>
            <div class="os-agent-sidebar__foot">
                <button type="button" class="os-agent-hide-all" id="os-agent-hide-all">Hide all</button>
                <a href="/teams/launch/"><i class="fas fa-users" aria-hidden="true"></i> Teams</a>
                <a href="/settings/"><i class="fas fa-gear" aria-hidden="true"></i> Settings</a>
            </div>
        </aside>
        <div id="os-agent-menu" class="os-agent-menu" role="menu" hidden></div>

        <main id="os-main" class="os-main" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    {# Mobile primary: Agents + More popup (Chat/Blueprints/Teams/Sessions/Settings). #}
    {% with path=request.path %}
    <nav class="os-bottom-nav d-lg-none" aria-label="Mobile primary">
        <a class="os-bottom-nav__item {% if path == '/agents' or path|slice:':8' == '/agents/' %}is-active{% endif %}"
           href="/agents" {% if path == '/agents' or path|slice:':8' == '/agents/' %}aria-current="page"{% endif %}>
            <span class="os-bottom-nav__label">Agents</span>
        </a>
        <div class="dropup os-bottom-nav__more">
            <button type="button"
                    class="os-bottom-nav__item os-bottom-nav__more-btn {% if path == '/chat' or path|slice:':6' == '/chat/' or '/blueprint' in path or path|slice:':7' == '/teams/' or path|slice:':10' == '/sessions/' or path|slice:':10' == '/settings/' or path|slice:':10' == '/profiles/' %}is-active{% endif %}"
                    id="moreNavDropdownMobile" data-bs-toggle="dropdown" data-bs-display="static"
                    aria-expanded="false" aria-haspopup="true" aria-label="More">
                <span class="os-bottom-nav__label">More</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="moreNavDropdownMobile">
                <li>
                    <a class="dropdown-item {% if path == '/chat' or path|slice:':6' == '/chat/' %}active{% endif %}"
                       href="/chat">Chat</a>
                </li>
                <li>
                    <a class="dropdown-item {% if '/blueprint' in path or '/agent-creator' in path or '/team-creator' in path %}active{% endif %}"
                       href="/blueprint-library/">Blueprints</a>
                </li>
                <li>
                    <a class="dropdown-item {% if path|slice:':7' == '/teams/' %}active{% endif %}"
                       href="/teams/launch/">Teams</a>
                </li>
                <li>
                    <a class="dropdown-item {% if path|slice:':10' == '/sessions/' %}active{% endif %}"
                       href="/sessions/">Sessions</a>
                </li>
                <li>
                    <a class="dropdown-item {% if path|slice:':10' == '/settings/' or path|slice:':10' == '/profiles/' %}active{% endif %}"
                       href="/settings/">Settings</a>
                </li>
            </ul>
        </div>
    </nav>
    {% endwith %}
    <script src="{% static 'js/agent_sidebar.js' %}"></script>
    <script src="{% static 'js/agent_pin_grid.js' %}"></script>
</body>
</html>
