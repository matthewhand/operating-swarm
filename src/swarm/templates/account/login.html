<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login &middot; Operating Swarm</title>
    {% include "includes/brand_icons.html" %}
    <link href="{% static 'css/operator.css' %}" rel="stylesheet">
</head>
<body class="os-login">
    <main class="login-card">
        <div class="brand">
            <img src="{% static 'brand/webui-geometric.svg' %}" alt="" width="64" height="64" class="brand-mark">
            <h1 class="brand-name">Open Swarm</h1>
            <p class="brand-sub">Sign in to continue</p>
        </div>
        {% if error %}
            <p class="error-message" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="{% url 'custom_login' %}?next={{ request.GET.next }}">
            {% csrf_token %}
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
