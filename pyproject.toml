[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-swarm"
version = "0.5.4"
description = "Open Swarm: Orchestrating AI Agent Swarms with Django"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Matthew Hand", email = "matthewhandau@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "Django>=4.2,<5.0",
    "djangorestframework>=3.14,<4.0",
    "openai>=1.3.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "django-cors-headers>=4.0.0",
    "uvicorn>=0.23.0",
    "gunicorn>=21.0.0",
    "psycopg2-binary>=2.9.0",
    "dj-database-url>=2.1.0",
    "django-extensions>=3.2.0",
    "drf-yasg>=1.21.0",
    "channels>=4.0",
    "channels-redis>=4.0",
    "daphne>=4.0.0",
    "tiktoken>=0.5.0",
    "platformdirs>=4.0.0",
    "typer>=0.9.0", # Changed from typer[all]
    "pyinstaller>=5.13.0",
    "httpx>=0.25.2,<0.26.0",
    "django-environ>=0.11.0",
    "django-model-utils>=4.3.0",
    "django-filter>=23.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "qdrant-client>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.2.1", # Version from uv install
    "openai-agents>=0.0.1",
    "jinja2>=3.1.6",
    "drf-spectacular>=0.28.0",
    "jmespath>=1.0.1",
    "filelock>=3.18.0",
]

[project.urls]
Homepage = "https://github.com/matthewhand/open-swarm"
Documentation = "https://github.com/matthewhand/open-swarm/blob/main/README.md"
Repository = "https://github.com/matthewhand/open-swarm.git"
Changelog = "https://github.com/matthewhand/open-swarm/blob/main/CHANGELOG.md"

[project.scripts]
swarm-api = "swarm.core.swarm_api:main"
swarm-cli = "swarm.core.swarm_cli:app"
codey = "swarm.blueprints.codey.codey_cli:main"
suggestion = "swarm.blueprints.suggestion.suggestion_cli:main"

[project.optional-dependencies]
tui = [
    # REQ-111 Wave 1a: interactive Herdr-like TUI chrome. Kept optional so a
    # plain core install stays thin; `swarm-cli tui` explains how to add it.
    "textual>=0.80.0,<1.0",
]
memory = [
    # The mem0 integration imports `from mem0 import Memory`; that module is
    # provided by the `mem0ai` distribution on PyPI (there is no `mem0` dist).
    "mem0ai>=0.1.0",
    # langmem and papr integrations are incomplete placeholders (see
    # src/swarm/memory/langmem_memory.py and src/swarm/memory/papr_memory.py;
    # their imports are commented out). The pins below do not resolve on PyPI
    # for all supported Python versions, so they are excluded until the
    # integrations are implemented.
    # "langmem>=0.1.0",
    # "papr>=0.1.0",
]
# NOTE: MCP server mode (ENABLE_MCP_SERVER) needs the `django-mcp-server`
# distribution (module `mcp_server`). It is NOT declared as an extra here because
# its transitive `mcp` SDK dependency only resolves with pre-releases enabled,
# which would break `uv lock --check`. Install it manually when you need MCP
# server mode: `pip install django-mcp-server` (see docs/mcp_server_mode.md).
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "factory-boy>=3.3.0",
    "ipython",
    "ipdb",
    "uv>=0.1.11",
]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",
    "factory-boy>=3.3.0",
    "sseclient-py>=1.7.2",
    # REQ-97 demo GIF validation (tests + scripts/render_demo_gif.py).
    "pillow>=10.0.0",
    "pytest-env>=1.0.0",
    "pytest-xdist",
    "anyio>=4.0.0",
    "respx>=0.20.0",
    "psutil>=5.9.0",
    "pytest-timeout>=2.1.0",
    # Browser automation for the opt-in golden-journey suite (tests/e2e_visual,
    # gated behind RUN_E2E_VISUAL=1; see .github/workflows/visual-regression.yml).
    "playwright>=1.49.0",
]
docs = [
    "Sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]
include = ["src/swarm/blueprints/**/*", "src/swarm/templates/**/*", "src/swarm/static/**/*"]
exclude = ["src/swarm/**/__pycache__", "src/swarm/**/*.pyc"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]



[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# plugins = ["mypy_django_plugin.main"]

# [tool.django-stubs]
# django_settings_module = "swarm.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "swarm.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
env = [
    "DJANGO_ALLOW_ASYNC_UNSAFE=true",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning:docutils.*:",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning:pkg_resources.*:",
    "ignore:Deprecated call to `pkg_resources.declare_namespace.*:DeprecationWarning:pkg_resources.*:",
    # Ignore the pytest-django fixture mark warning for now
    "ignore:Marks applied to fixtures have no effect:pytest.PytestRemovedIn9Warning",
]

[tool.coverage.run]
source = ["src/swarm"]
omit = ["*/migrations/*", "*/tests/*", "src/swarm/settings.py", "src/swarm/wsgi.py", "src/swarm/asgi.py", "src/swarm/manage.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25.1",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
    "pytest-mock>=3.14.0",
]
