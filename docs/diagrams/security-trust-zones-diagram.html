<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security &amp; Trust Zones · Operating Swarm</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --color-link:   #6ea8fe;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Security · Operating Swarm</p>
    <h1>Security &amp; Trust Zones</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec-title sec-desc">
      <title id="sec-title">Operating Swarm security trust zones</title>
      <desc id="sec-desc">Nested trust zones from the untrusted public network inward through the LAN and same-origin browser, the authenticated application process, and the most privileged host execution ring. A side column lists edge controls, execution controls including workdir confinement and the AST sandbox, and credential and egress handling.</desc>
      <defs>
        <pattern id="dots-sec" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots-sec)" opacity="0.55"/>

      <!-- Nested trust rings -->
      <rect x="24" y="48" width="616" height="444" rx="10" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
      <text x="44" y="70" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">RING 0 · PUBLIC NETWORK — UNTRUSTED</text>

      <rect x="64" y="88" width="536" height="364" rx="10" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
      <text x="84" y="110" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">RING 1 · LAN / SAME-ORIGIN BROWSER</text>

      <rect x="104" y="128" width="456" height="284" rx="10" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.45)" stroke-width="1"/>
      <text x="124" y="150" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">RING 2 · AUTHENTICATED APP PROCESS</text>

      <rect x="144" y="168" width="376" height="204" rx="10" fill="rgba(240,138,89,0.07)" stroke="rgba(240,138,89,0.55)" stroke-width="1.5"/>
      <text x="164" y="190" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">RING 3 · HOST PRIVILEGED EXECUTION (FOCAL)</text>

      <g transform="translate(160,210)">
        <rect width="168" height="44" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="84" y="19" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CLI subprocess / PTY</text>
        <text x="84" y="35" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">inherits host creds</text>
      </g>
      <g transform="translate(344,210)">
        <rect width="168" height="44" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="84" y="19" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Filesystem browse</text>
        <text x="84" y="35" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">workdir-confined</text>
      </g>
      <g transform="translate(160,268)">
        <rect width="168" height="44" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="84" y="19" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Browser control</text>
        <text x="84" y="35" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">opt-in capability</text>
      </g>
      <g transform="translate(344,268)">
        <rect width="168" height="44" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="84" y="19" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Self-update / exec</text>
        <text x="84" y="35" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">privileged op</text>
      </g>
      <text x="164" y="340" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" opacity="0.8">These run with the process's OS privileges — the real trust boundary.</text>
      <text x="164" y="356" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" opacity="0.8">Runtime mode: bare-metal | sandbox-home | sandbox-isolated.</text>

      <!-- Controls column -->
      <text x="664" y="70" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">CONTROLS BY BOUNDARY</text>

      <g transform="translate(660,80)">
        <rect width="316" height="150" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="16" y="24" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">PUBLIC → APP</text>
        <text x="16" y="46" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">Bearer token or session cookie</text>
        <text x="16" y="64" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">CSRF on session POSTs · prod CSP</text>
        <text x="16" y="82" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">AllowedHostsOriginValidator (WS)</text>
        <text x="16" y="100" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">auth off ⇒ anonymous WS close 4401</text>
        <text x="16" y="118" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">nosniff · frame-deny · ALLOWED_HOSTS</text>
        <text x="16" y="138" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8">prod refuses boot without secret + hosts + token</text>
      </g>

      <g transform="translate(660,244)">
        <rect width="316" height="150" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="16" y="24" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">APP → HOST</text>
        <text x="16" y="46" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">Workdir confinement (SWARM_WORKSPACES_DIR)</text>
        <text x="16" y="64" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">Absolute outside-root paths rejected</text>
        <text x="16" y="82" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">Blueprint AST sandbox — static, NOT an OS sandbox</text>
        <text x="16" y="100" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">User blueprint discovery off by default</text>
        <text x="16" y="118" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">Bundled blueprints skip the gate (trusted)</text>
        <text x="16" y="138" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8">ALLOW_UNRESTRICTED_WORKDIR = escape hatch, keep off on servers</text>
      </g>

      <g transform="translate(660,408)">
        <rect width="316" height="132" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="16" y="24" fill="#6ea8fe" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">CREDENTIALS → EGRESS</text>
        <text x="16" y="46" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">API tokens / keys: env only</text>
        <text x="16" y="64" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">CLI OAuth lives in host home (rw mount)</text>
        <text x="16" y="82" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">Per-harness tokens · redaction on logs</text>
        <text x="16" y="100" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11">IDOR: exact token:/user: principal</text>
        <text x="16" y="120" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8">secrets never written to the chat store</text>
      </g>

      <!-- Legend -->
      <line x1="24" y1="528" x2="976" y2="528" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="24" y="552" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">LEGEND</text>
      <rect x="110" y="540" width="16" height="16" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
      <text x="134" y="553" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Untrusted zone</text>
      <rect x="330" y="540" width="16" height="16" rx="6" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.45)" stroke-width="1"/>
      <text x="354" y="553" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Authenticated process</text>
      <rect x="570" y="540" width="16" height="16" rx="6" fill="rgba(240,138,89,0.07)" stroke="#f08a59" stroke-width="1.5"/>
      <text x="594" y="553" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Most-privileged execution (focal)</text>
      <text x="24" y="592" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" opacity="0.75">SOURCES: docs/AUTH.md · src/swarm/core/blueprint_sandbox.py · src/swarm/runtime_views.py · src/swarm/permissions.py · docs/REMOTE_HARNESSES.md</text>
      <text x="24" y="608" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" opacity="0.75">LIMITATION: the AST filter is a static gate, not process isolation; container sandboxing depends on runtime mode and mounts — no hard jail is claimed here.</text>
    </svg>
  </div>
</body>
</html>
