<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operating Swarm · System Architecture &amp; Trust Boundaries</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --color-link:   #6ea8fe;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Operating Swarm</p>
    <h1>Operating Swarm · System Architecture &amp; Trust Boundaries</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="os-sysarch-title os-sysarch-desc">
      <title id="os-sysarch-title">Operating Swarm system architecture and trust boundaries</title>
      <desc id="os-sysarch-desc">Zoned architecture: untrusted clients cross an auth and CSRF boundary into the trusted Django ASGI application (REST edge, websocket edge, auth, seat router, routines/MCP), which reads and writes local Postgres or SQLite and files, and makes outbound calls over the internet to model providers, remote harnesses, and GitHub.</desc>
      <defs>
        <pattern id="grid-dots-sysarch" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="rgba(245,245,245,0.07)"/>
        </pattern>
        <marker id="sysarch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="sysarch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
        <marker id="sysarch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6ea8fe"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#grid-dots-sysarch)" opacity="0.6"/>

      <!-- Vertical flow connectors drawn before boxes -->
      <line x1="500" y1="92" x2="500" y2="120" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#sysarch-arrow)"/>
      <line x1="500" y1="160" x2="500" y2="188" stroke="#f08a59" stroke-width="2" marker-end="url(#sysarch-arrow-accent)"/>
      <line x1="500" y1="360" x2="500" y2="392" stroke="#bfc0c0" stroke-width="1" marker-end="url(#sysarch-arrow)"/>
      <line x1="980" y1="270" x2="980" y2="500" stroke="#6ea8fe" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sysarch-arrow-link)"/>

      <!-- Zone 1: untrusted clients -->
      <text x="24" y="30" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">ZONE 1 · UNTRUSTED CLIENT NETWORK</text>
      <rect x="24" y="16" width="952" height="76" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.14)" stroke-width="1"/>
      <g transform="translate(48,38)">
        <rect width="280" height="36" rx="6" fill="rgba(191,192,192,0.10)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Browser SPA</text>
      </g>
      <g transform="translate(360,38)">
        <rect width="280" height="36" rx="6" fill="rgba(191,192,192,0.10)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">API / SDK client (curl, Open WebUI)</text>
      </g>
      <g transform="translate(672,38)">
        <rect width="280" height="36" rx="6" fill="rgba(191,192,192,0.10)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">os-peer / desktop tray</text>
      </g>

      <!-- Zone 2: trust boundary -->
      <text x="24" y="136" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">BOUNDARY · ENFORCED AT THE EDGE</text>
      <rect x="24" y="120" width="952" height="40" rx="6" fill="rgba(240,138,89,0.06)" stroke="rgba(240,138,89,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="500" y="145" fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">TLS / reverse proxy (optional) · Bearer token or session cookie · CSRF · prod CSP · 4401 closes anonymous WS</text>

      <!-- Zone 3: trusted application -->
      <text x="24" y="204" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">ZONE 2 · TRUSTED APPLICATION PROCESS (swarm.asgi)</text>
      <rect x="24" y="188" width="952" height="172" rx="8" fill="rgba(240,138,89,0.06)" stroke="rgba(240,138,89,0.55)" stroke-width="1.5"/>
      <g transform="translate(48,216)">
        <rect width="280" height="56" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">REST edge (views)</text>
        <text x="140" y="41" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">/v1/chat · /v1/responses · /health</text>
      </g>
      <g transform="translate(360,216)">
        <rect width="280" height="56" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">WebSocket edge (Channels)</text>
        <text x="140" y="41" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">/ws/ai-demo/&lt;id&gt;/ · /ws/spa/</text>
      </g>
      <g transform="translate(672,216)">
        <rect width="280" height="56" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Auth &amp; permissions</text>
        <text x="140" y="41" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">StaticTokenAuthentication · principal</text>
      </g>
      <g transform="translate(48,288)">
        <rect width="280" height="56" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Seat router &amp; blueprint registry</text>
        <text x="140" y="41" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">CLI · API · Team · Remote</text>
      </g>
      <g transform="translate(360,288)">
        <rect width="280" height="56" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Routines &amp; MCP provider</text>
        <text x="140" y="41" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">in-process schedule engine</text>
      </g>
      <g transform="translate(672,288)">
        <rect width="280" height="56" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Blueprint AST sandbox</text>
        <text x="140" y="41" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">user/community source gate</text>
      </g>

      <!-- Zone 4: local data -->
      <text x="24" y="408" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">ZONE 3 · LOCAL DATA (SAME HOST)</text>
      <rect x="24" y="392" width="952" height="108" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.16)" stroke-width="1"/>
      <g transform="translate(48,420)">
        <rect width="280" height="56" rx="6" fill="rgba(191,192,192,0.06)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Postgres 16 / SQLite</text>
        <text x="140" y="41" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">chat, prefs, sessions</text>
      </g>
      <g transform="translate(360,420)">
        <rect width="280" height="56" rx="6" fill="rgba(191,192,192,0.06)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">~/.local/share/swarm</text>
        <text x="140" y="41" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">responses store · CLI state</text>
      </g>
      <g transform="translate(672,420)">
        <rect width="280" height="56" rx="6" fill="rgba(191,192,192,0.06)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">~/.config/swarm</text>
        <text x="140" y="41" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">profiles · blueprints · routines</text>
      </g>

      <!-- Zone 5: external network -->
      <text x="24" y="528" fill="#6ea8fe" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">ZONE 4 · EXTERNAL NETWORK (EGRESS)</text>
      <rect x="24" y="512" width="952" height="108" rx="8" fill="rgba(110,168,254,0.05)" stroke="rgba(110,168,254,0.45)" stroke-width="1" stroke-dasharray="4,4"/>
      <g transform="translate(48,540)">
        <rect width="280" height="56" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Model providers</text>
        <text x="140" y="41" fill="#6ea8fe" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">HTTPS · API keys / OAuth</text>
      </g>
      <g transform="translate(360,540)">
        <rect width="280" height="56" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Remote harnesses</text>
        <text x="140" y="41" fill="#6ea8fe" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">HTTP / WS / SSH · per-harness</text>
      </g>
      <g transform="translate(672,540)">
        <rect width="280" height="56" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="140" y="23" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">GitHub</text>
        <text x="140" y="41" fill="#6ea8fe" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">REST / webhooks · token</text>
      </g>

      <!-- Legend -->
      <line x1="24" y1="640" x2="976" y2="640" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="24" y="660" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="656" x2="146" y2="656" stroke="#f08a59" stroke-width="2" marker-end="url(#sysarch-arrow-accent)"/>
      <text x="158" y="660" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Authenticated request path</text>
      <line x1="420" y1="656" x2="456" y2="656" stroke="#bfc0c0" stroke-width="1" marker-end="url(#sysarch-arrow)"/>
      <text x="468" y="660" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Local read / write</text>
      <line x1="680" y1="656" x2="716" y2="656" stroke="#6ea8fe" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sysarch-arrow-link)"/>
      <text x="728" y="660" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Outbound egress</text>
      <text x="24" y="684" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" opacity="0.75">SOURCES: src/swarm/asgi.py · src/swarm/urls.py · src/swarm/routing.py · src/swarm/settings.py · docs/AUTH.md · docker-compose.yml</text>
    </svg>
  </div>
</body>
</html>
