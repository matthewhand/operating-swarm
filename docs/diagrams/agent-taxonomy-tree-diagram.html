<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Agent Seats Taxonomy · Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Taxonomy Tree · Open Swarm</p>
    <h1>Four Agent Seats Architecture</h1>

    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="taxonomy-tree-title taxonomy-tree-desc">
      <title id="taxonomy-tree-title">Four Agent Seats Architecture</title>
      <desc id="taxonomy-tree-desc">Tree hierarchy diagram showing Open Swarm root decomposing into CLI, API, Blueprint, and Remote agent seats with concrete adapter implementations.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Connecting Tree Lines from Root -->
      <path d="M 500 84 L 500 132 L 138 132 L 138 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 500 84 L 500 132 L 380 132 L 380 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 500 84 L 500 172" fill="none" stroke="#f08a59" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
      <path d="M 500 84 L 500 132 L 862 132 L 862 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connecting Lines to Sub-Leaves -->
      <!-- CLI Leaves -->
      <line x1="138" y1="244" x2="138" y2="300" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- API Leaves -->
      <line x1="380" y1="244" x2="380" y2="300" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- Blueprint Leaves (Accent) -->
      <line x1="500" y1="244" x2="500" y2="300" stroke="#f08a59" stroke-width="1.4"/>
      <!-- Remote Leaves -->
      <line x1="862" y1="244" x2="862" y2="300" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ROOT NODE -->
      <g transform="translate(380, 24)">
        <rect width="240" height="60" rx="8" fill="#353a4e" stroke="rgba(245,245,245,0.3)" stroke-width="1.2"/>
        <text x="120" y="26" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Open Swarm Seats</text>
        <text x="120" y="44" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">4 Canonical Kinds (Locked)</text>
      </g>

      <!-- BRANCH 1: CLI -->
      <g transform="translate(32, 176)">
        <rect width="212" height="68" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="16" y="28" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600">CLI Seat</text>
        <text x="16" y="48" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10">Host native binary runtime</text>
      </g>
      <!-- CLI Leaves -->
      <g transform="translate(32, 308)">
        <rect width="212" height="180" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.15)" stroke-width="0.8"/>
        <text x="16" y="24" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">ADAPTERS</text>
        <text x="16" y="48" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">grok / agy CLI</text>
        <text x="16" y="66" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Native PTY session</text>
        <text x="16" y="96" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">claude / gemini</text>
        <text x="16" y="114" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Subprocess execution</text>
        <text x="16" y="144" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">opencode / codex</text>
        <text x="16" y="162" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Local workspace context</text>
      </g>

      <!-- BRANCH 2: API -->
      <g transform="translate(274, 176)">
        <rect width="212" height="68" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="16" y="28" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600">API Seat</text>
        <text x="16" y="48" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10">True inference chat completions</text>
      </g>
      <!-- API Leaves -->
      <g transform="translate(274, 308)">
        <rect width="212" height="180" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.15)" stroke-width="0.8"/>
        <text x="16" y="24" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">ADAPTERS</text>
        <text x="16" y="48" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">LiteLLM Proxy</text>
        <text x="16" y="66" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Model aliasing &amp; fallback</text>
        <text x="16" y="96" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">Ollama / vLLM</text>
        <text x="16" y="114" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Local model weights</text>
        <text x="16" y="144" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">OpenAI / Groq Endpoints</text>
        <text x="16" y="162" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Direct cloud completion</text>
      </g>

      <!-- BRANCH 3: BLUEPRINT (Focal) -->
      <g transform="translate(514, 176)">
        <rect width="212" height="68" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="16" y="28" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600">Blueprint Seat</text>
        <text x="16" y="48" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="10">Programmatic recipes &amp; teams</text>
      </g>
      <!-- Blueprint Leaves -->
      <g transform="translate(514, 308)">
        <rect width="212" height="180" rx="6" fill="rgba(240,138,89,0.06)" stroke="#f08a59" stroke-width="1"/>
        <text x="16" y="24" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">COMPOSITION</text>
        <text x="16" y="48" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Team Blueprint Subtype</text>
        <text x="16" y="66" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="9">Roster + handoff routing</text>
        <text x="16" y="96" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">Mixture of Agents (MoA)</text>
        <text x="16" y="114" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Layered proposer &amp; aggregator</text>
        <text x="16" y="144" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">openai-agents SDK</text>
        <text x="16" y="162" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">Handoff &amp; agent-as-tool</text>
      </g>

      <!-- BRANCH 4: REMOTE -->
      <g transform="translate(756, 176)">
        <rect width="212" height="68" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="16" y="28" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600">Remote Seat</text>
        <text x="16" y="48" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10">External autonomous harnesses</text>
      </g>
      <!-- Remote Leaves -->
      <g transform="translate(756, 308)">
        <rect width="212" height="180" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.15)" stroke-width="0.8"/>
        <text x="16" y="24" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">HARNESSES</text>
        <text x="16" y="48" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">Hermes Agent</text>
        <text x="16" y="66" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">OpenShell sandbox container</text>
        <text x="16" y="96" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">OpenMousBot / Rakazo</text>
        <text x="16" y="114" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">HTTP remote agent API</text>
        <text x="16" y="144" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12">Herdr SSH Cluster</text>
        <text x="16" y="162" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9">SSH-based command harness</text>
      </g>

      <!-- Legend -->
      <g transform="translate(32, 524)">
        <rect x="8" y="4" width="14" height="14" rx="2" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="32" y="16" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="500">Blueprint &amp; Team orchestration</text>

        <rect x="250" y="4" width="14" height="14" rx="2" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="274" y="16" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11">Standard execution seats</text>

        <line x1="470" y1="12" x2="498" y2="12" stroke="#f08a59" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
        <text x="510" y="16" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="10">Primary team handoff hierarchy</text>
      </g>
    </svg>
  </div>
</body>
</html>
