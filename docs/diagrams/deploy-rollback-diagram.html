<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deploy &amp; Rollback Pipeline · Operating Swarm</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --color-link:   #6ea8fe;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Operations · Operating Swarm</p>
    <h1>Deploy &amp; Rollback Pipeline</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-title deploy-desc">
      <title id="deploy-title">Deploy and rollback pipeline</title>
      <desc id="deploy-desc">Left-to-right release pipeline: a change reaches CI gates (backend pytest, frontend vitest, Postgres migrate smoke, TypeScript ratchet), produces a multi-arch Docker image and PyPI artifacts, deploys via Compose, Fly or Oracle, and verifies with the health probe and smoke script. A dashed rollback path redeploys the previous known-good tag.</desc>
      <defs>
        <pattern id="dots-dep" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
        <marker id="dep-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="dep-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots-dep)" opacity="0.55"/>

      <!-- Forward connectors -->
      <line x1="196" y1="150" x2="212" y2="150" stroke="#f08a59" stroke-width="2" marker-end="url(#dep-arrow-accent)"/>
      <line x1="392" y1="150" x2="408" y2="150" stroke="#f08a59" stroke-width="2" marker-end="url(#dep-arrow-accent)"/>
      <line x1="588" y1="150" x2="604" y2="150" stroke="#f08a59" stroke-width="2" marker-end="url(#dep-arrow-accent)"/>
      <line x1="784" y1="150" x2="800" y2="150" stroke="#f08a59" stroke-width="2" marker-end="url(#dep-arrow-accent)"/>

      <!-- Rollback connector -->
      <line x1="892" y1="366" x2="892" y2="440" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4"/>
      <line x1="892" y1="440" x2="696" y2="440" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4"/>
      <line x1="696" y1="440" x2="696" y2="366" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#dep-arrow)"/>
      <rect x="700" y="424" width="192" height="14" rx="2" fill="#2d3142"/>
      <text x="796" y="435" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">redeploy previous good tag</text>

      <!-- Column 1 -->
      <text x="108" y="52" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" text-anchor="middle">CHANGE</text>
      <rect x="20" y="62" width="176" height="304" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
      <g transform="translate(34,80)">
        <rect width="148" height="64" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="26" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pull request</text>
        <text x="74" y="44" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">feat/ · fix/ · chore/</text>
        <text x="74" y="56" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">Closes #n</text>
      </g>
      <g transform="translate(34,168)">
        <rect width="148" height="64" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="26" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Review + gate</text>
        <text x="74" y="44" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">3 verification gates</text>
        <text x="74" y="56" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">must pass before merge</text>
      </g>
      <g transform="translate(34,256)">
        <rect width="148" height="92" rx="6" fill="rgba(191,192,192,0.06)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Self-update path</text>
        <text x="74" y="42" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">in-app CLI opens PR</text>
        <text x="74" y="58" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">prints PR URL card</text>
        <text x="74" y="74" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">REQ-79 / #424</text>
      </g>

      <!-- Column 2: CI gates -->
      <text x="304" y="52" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" text-anchor="middle">CI GATES</text>
      <rect x="216" y="62" width="176" height="304" rx="8" fill="rgba(240,138,89,0.06)" stroke="rgba(240,138,89,0.50)" stroke-width="1.5"/>
      <g transform="translate(230,80)">
        <rect width="148" height="60" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Backend pytest</text>
        <text x="74" y="42" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">uv sync · uv run pytest</text>
      </g>
      <g transform="translate(230,152)">
        <rect width="148" height="60" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Frontend vitest</text>
        <text x="74" y="42" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">npm ci · npm test</text>
      </g>
      <g transform="translate(230,224)">
        <rect width="148" height="60" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Migrate smoke</text>
        <text x="74" y="42" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">local Postgres + DSN</text>
      </g>
      <g transform="translate(230,296)">
        <rect width="148" height="52" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">TS ratchet + build</text>
        <text x="74" y="42" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">tsc --noEmit · vite build</text>
      </g>

      <!-- Column 3: artifacts -->
      <text x="500" y="52" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" text-anchor="middle">ARTIFACTS</text>
      <rect x="412" y="62" width="176" height="304" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
      <g transform="translate(426,88)">
        <rect width="148" height="92" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="26" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Docker image</text>
        <text x="74" y="46" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">linux/amd64 · arm64</text>
        <text x="74" y="62" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">multi-stage · dist baked</text>
        <text x="74" y="78" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">open-swarm:latest</text>
      </g>
      <g transform="translate(426,196)">
        <rect width="148" height="92" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="26" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PyPI package</text>
        <text x="74" y="46" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">sdist + wheel</text>
        <text x="74" y="62" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">twine check</text>
        <text x="74" y="78" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">testpypi → pypi</text>
      </g>
      <g transform="translate(426,304)">
        <rect width="148" height="44" rx="6" fill="rgba(191,192,192,0.06)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="74" y="27" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tag / release</text>
      </g>

      <!-- Column 4: deploy -->
      <text x="696" y="52" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" text-anchor="middle">DEPLOY</text>
      <rect x="608" y="62" width="176" height="304" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
      <g transform="translate(622,88)">
        <rect width="148" height="72" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Compose</text>
        <text x="74" y="42" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">docker compose up --build</text>
        <text x="74" y="58" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">migrate → up</text>
      </g>
      <g transform="translate(622,172)">
        <rect width="148" height="72" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fly.io / Oracle</text>
        <text x="74" y="42" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">push image · release</text>
        <text x="74" y="58" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">systemd restart (native)</text>
      </g>
      <g transform="translate(622,256)">
        <rect width="148" height="92" rx="6" fill="#353a4e" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Activate</text>
        <text x="74" y="42" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">migrate --fake-initial</text>
        <text x="74" y="58" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">rollout / recreate</text>
        <text x="74" y="74" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">keep previous image tag</text>
      </g>

      <!-- Column 5: verify -->
      <text x="892" y="52" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" text-anchor="middle">VERIFY</text>
      <rect x="804" y="62" width="176" height="304" rx="8" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.45)" stroke-width="1"/>
      <g transform="translate(818,88)">
        <rect width="148" height="80" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">/health green</text>
        <text x="74" y="44" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">liveness 200</text>
        <text x="74" y="60" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">compose marks healthy</text>
      </g>
      <g transform="translate(818,180)">
        <rect width="148" height="80" rx="6" fill="#383d54" stroke="#f08a59" stroke-width="1.5"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smoke + schema</text>
        <text x="74" y="44" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">scripts/smoke_api.sh</text>
        <text x="74" y="60" fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">GET /api/schema/ 200</text>
      </g>
      <g transform="translate(818,272)">
        <rect width="148" height="76" rx="6" fill="rgba(191,192,192,0.06)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="74" y="24" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fail → rollback</text>
        <text x="74" y="44" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">redeploy previous tag</text>
        <text x="74" y="60" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">migrations stay forward</text>
      </g>

      <!-- Legend -->
      <line x1="24" y1="500" x2="976" y2="500" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="24" y="524" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="520" x2="146" y2="520" stroke="#f08a59" stroke-width="2" marker-end="url(#dep-arrow-accent)"/>
      <text x="158" y="524" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Forward pipeline</text>
      <line x1="360" y1="520" x2="396" y2="520" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#dep-arrow)"/>
      <text x="408" y="524" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Rollback (redeploy previous image tag)</text>
      <rect x="740" y="512" width="16" height="16" rx="6" fill="rgba(240,138,89,0.06)" stroke="rgba(240,138,89,0.50)" stroke-width="1.5"/>
      <text x="764" y="524" fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12">Gated stage</text>
      <text x="24" y="566" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" opacity="0.75">SOURCES: .github/workflows/python-pytest.yml · .github/workflows/docker-io-fly-deploy.yml · .github/workflows/publish.yml · Dockerfile · docs/DEPLOYMENT.md · docs/SELF_UPDATE.md</text>
      <text x="24" y="582" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" opacity="0.75">ASSUMPTION: rollback preserves forward-only migrations (no destructive down-migration); the operator redeploys the previous known-good image tag.</text>
    </svg>
  </div>
</body>
</html>
