<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integration Topology · Operating Swarm</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --color-link:   #6ea8fe;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Integrations · Operating Swarm</p>
    <h1>Integration Topology &amp; External Dependencies</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="integ-title integ-desc">
      <title id="integ-title">Operating Swarm integration topology</title>
      <desc id="integ-desc">Integration map: inbound clients and webhooks reach the core integration layer (CLI adapter, LLM profile client, remote adapter registry, MCP provider, GitHub client), which makes outbound calls to model providers, local model runtimes, remote HTTP harnesses, Herdr over CLI or SSH, GitHub, and MCP servers, each with its own transport and auth.</desc>

        <pattern id="dots-integ" width="22" height="22" patternUnits="userSpaceOnUse">

        <marker id="integ-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="integ-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
        <marker id="integ-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6ea8fe"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots-integ)" opacity="0.55"/>

      <!-- Outbound arrows (blue) -->
      <line x1="90" y1="256" x2="90" y2="396" stroke="#6ea8fe" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#integ-arrow-link)"/>
      <line x1="254" y1="256" x2="254" y2="396" stroke="#6ea8fe" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#integ-arrow-link)"/>
      <line x1="418" y1="256" x2="418" y2="396" stroke="#6ea8fe" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#integ-arrow-link)"/>

      <text x="240" y="68" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">/v1/chat · /v1/responses</text>

      <text x="500" y="68" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">HTTP + WebSocket</text>
      <text x="500" y="86" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">session cookie + CSRF</text>

        <text x="76" y="30" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Local runtime</text>
        <text x="76" y="52" fill="#6ea8fe" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">HTTP</text>
