# Open Swarm — containerized gateway.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS GIVES YOU BY DEFAULT: the OpenAI-compatible API only.
# ─────────────────────────────────────────────────────────────────────────────
# Out of the box this container serves /v1/chat/completions, /v1/responses and
# /v1/models backed by your REST / LLM profiles (the `llm` block in
# swarm_config.json). That covers the pure-REST blueprints (chatbot, the REST
# half of hybrid_team, anything that talks to an OpenAI-compatible HTTP backend).
#
# It does NOT include the agentic CLIs (claude, grok, gemini, codex, opencode).
# Those carry their OWN host-bound auth (OAuth / device login living in your home
# dir) and cannot be baked into a portable image. So the CLI-driven blueprints
# (cli_agent, cli_fusion, cli_orchestrator, cli_map, persona_council, the cli_*
# orchestrators, the CLI half of the hybrids) will NOT work until you map each
# CLI in yourself.
#
# ── The trade-off of running in a container ──
# To use any CLI blueprint you must map that CLI's binary, runtime and auth
# folder into the container MANUALLY. This is deliberate — the project does not
# ship/maintain mappings for every CLI (paths, runtimes and login state differ
# per host and per version). Copy docker-compose.override.example.yml to
# docker-compose.override.yml, uncomment the CLIs you actually have, and adjust
# the paths to your machine. Compose auto-merges the override on `up`.
#
# Native (systemd-on-host) deployment avoids all of this — the CLIs are already
# installed and authed. See docs/ORACLE_DEPLOY.md. Use the container when you
# only need the REST surface, or you're willing to map the CLIs by hand.
#
# Quick start (production-ish):
#   echo "DOCKER_UID=$(id -u)" >  .env
#   echo "DOCKER_GID=$(id -g)" >> .env
#   # REQUIRED for non-debug: API_AUTH_TOKEN, DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS
#   # For local open API only: SWARM_ALLOW_NO_AUTH=true  (NOT the default)
#   docker compose up --build
#   # …then add docker-compose.override.yml for host CLIs if needed.
#
# Durable DB (REQ-123 / #508): local Postgres in this stack is the happy path.
# Cloud operators set DATABASE_URL (or POSTGRES_*) to any Postgres. Neon is
# test/CI/experiments only — never a default hostname. Native pytest / desktop
# still use SQLite when DATABASE_URL is unset. See docs/DATABASE.md.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-swarm}"
      POSTGRES_USER: "${POSTGRES_USER:-swarm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-swarm}"
    volumes:
      - swarm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  swarm:
    build:
      context: .
      args:
        PORT: "8000"
    image: open-swarm:local
    # Run as your host user so any folders you later bind-mount (CLI auth, config)
    # stay readable/writable and files the app writes don't end up root-owned.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Inject provider keys / app config from .env (e.g. DATABASE_URL, *_API_KEY).
    # required:false keeps this portable — a no-op when no .env is present.
    # Explicit `environment:` below still wins over anything in .env.
    env_file:
      - path: .env
        required: false
    ports:
      # Portable default. On a host where 8000 is taken (e.g. another service),
      # remap with an override rather than editing this published default.
      # For bind-mount + uvicorn --reload, use: make dev (docker-compose.dev.yml, :8002).
      - "8000:8000"
    extra_hosts:
      # Host TrueForge / OMB / Rakazo at 127.0.0.1:* rewrite to this name.
      - "host.docker.internal:host-gateway"
    environment:
      # Pin the in-container listen port. `environment` wins over `env_file`, so
      # this shields the container from a host-oriented PORT in .env (e.g. the
      # gateway's 8765) — the published `ports:` mapping alone sets the host port.
      PORT: "8000"
      # Keep HOME identical to the host so configs that reference absolute paths
      # resolve, and the bare CLI commands find their state once you map them in.
      HOME: "${HOME}"
      # Production defaults: auth ON unless .env sets SWARM_ALLOW_NO_AUTH=true
      # (explicit opt-out for local demos / reverse-proxy auth).
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-}"
      # Durable Django DB: local Compose Postgres by default. Override with
      # DATABASE_URL for any cloud Postgres. Compose-internal user/password
      # "swarm"/"swarm" is a local placeholder — not a production secret.
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-swarm}"
      POSTGRES_USER: "${POSTGRES_USER:-swarm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-swarm}"
      DATABASE_URL: "${DATABASE_URL:-postgres://swarm:swarm@postgres:5432/swarm}"
      # Async /v1/responses store on the mounted volume (not the Django DB).
      SWARM_RESPONSES_DIR: "${HOME}/.local/share/swarm/responses"
      # Async /v1/responses cancel + inflight limits are process-local until a
      # shared queue exists. Keep a single uvicorn worker (see Dockerfile CMD).
      SWARM_UVICORN_WORKERS: "${SWARM_UVICORN_WORKERS:-1}"
      # REQ-45 runtime mode. This compose file bind-mounts $HOME config/state,
      # so the instance is a developer sandbox with home access — not isolated
      # and not bare-metal. Pinokio pinokio/start.js also sets this. Values:
      # bare-metal | sandbox-home | sandbox-isolated
      SWARM_RUNTIME: "${SWARM_RUNTIME:-sandbox-home}"
      SWARM_HOST_GATEWAY: "${SWARM_HOST_GATEWAY:-host.docker.internal}"
      # REQ-916 / #515 / #690: external name for container-gateway aliases
      # (host.docker.internal & co) as seen from LAN browsers. Rewrites the
      # browser-facing ui_url even when the server itself is in a container.
      SWARM_HOST_GATEWAY_EXTERNAL: "${SWARM_HOST_GATEWAY_EXTERNAL:-}"
      ENABLE_WEBUI: "${ENABLE_WEBUI:-true}"
    volumes:
      # Your swarm config (llm profiles, cli_agents, blueprint_library.json).
      # #762: must stay WRITABLE — blueprint_library.json persistence lives here
      # (POST /v1/blueprints/custom/ 500s "failed to persist" on a read-only
      # mount) and the app treats ~/.config/swarm as its live config home.
      - "${HOME}/.config/swarm:${HOME}/.config/swarm"
      # Writable state: async /v1/responses task store (Django DB is Postgres).
      - "${HOME}/.local/share/swarm:${HOME}/.local/share/swarm"
      # #716/#717: host CLI binaries, ro, at identical paths so the catalog's
      # discovery (extra_cli_path_dirs/which_cli) sees what the host sees —
      # agy/opencode/grok et al. Missing dirs are created empty (no discovery
      # impact); SWARM_CLI_PATH_DIRS can point discovery at anything else.
      - "${HOME}/.local/bin:${HOME}/.local/bin:ro"
      - "${HOME}/bin:${HOME}/bin:ro"
      - "${HOME}/.grok/bin:${HOME}/.grok/bin:ro"
      - "${HOME}/.opencode/bin:${HOME}/.opencode/bin:ro"
      - "${HOME}/.npm-global/bin:${HOME}/.npm-global/bin:ro"
      - "${HOME}/.local/share/pnpm:${HOME}/.local/share/pnpm:ro"
      - "${HOME}/.nvm/versions/node:${HOME}/.nvm/versions/node:ro"
      # #1125: CLI state homes the binaries mkdir into on first run — the
      # serving container's $HOME is root-owned (REQ-45 sandbox-home), so an
      # unwritable state dir bricks the seat (opencode EACCES). Writable,
      # same doctrine as the #762 config mount.
      - "${HOME}/.local/share/opencode:${HOME}/.local/share/opencode"
      - "${HOME}/.cache/opencode:${HOME}/.cache/opencode"
      - "${HOME}/.local/state/opencode:${HOME}/.local/state/opencode"
      # #1140: the list-models probes for the remaining CLIs mkdir their own
      # state dirs in-container (root-owned HOME → EACCES kills the probe).
      # gemini/agy need ~/.gemini, opencode's probe needs ~/.config/opencode,
      # codex's setup probe needs ~/.codex. Writable, same doctrine as #1125.
      - "${HOME}/.gemini:${HOME}/.gemini"
      - "${HOME}/.config/opencode:${HOME}/.config/opencode"
      - "${HOME}/.codex:${HOME}/.codex"
      # #1175: the CLI *exec* path (not just probes) needs state/binary dirs:
      # qwen mkdirs ~/.qwen on first run; hermes's launcher + venv live in
      # ~/.hermes (its python symlinks into ~/.local/share/uv, mounted ro
      # below); grok's binary is a symlink into ~/.grok/downloads and grok
      # writes session state under ~/.grok (writable).
      - "${HOME}/.qwen:${HOME}/.qwen"
      - "${HOME}/.hermes:${HOME}/.hermes"
      - "${HOME}/.grok:${HOME}/.grok"
      - "${HOME}/.local/share/uv:${HOME}/.local/share/uv:ro"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Cap retries so an unreachable / quota-exhausted DATABASE_URL (e.g. Neon
    # free-tier) fails fast with a clear log instead of crash-looping silently.
    # systemd units also use RestartPreventExitStatus=78 — see the Neon runbook.
    restart: "on-failure:5"

volumes:
  swarm_pgdata:
