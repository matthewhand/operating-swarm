<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Operating Swarm">
  <!--
    option3-minimal-brand-mark : favicon / PWA / small chrome.
    Top-down symmetrical silhouette. Gold #EBA222 / black #111111 on slate
    #17212A. Project-owned recreation of the #537 taster; no stock art.
  -->
  <title>Operating Swarm</title>
  <rect width="64" height="64" rx="14" fill="#17212A"/>

  <!-- Wings: two solid petals -->
  <ellipse cx="15.5" cy="31" rx="13.2" ry="8.4" transform="rotate(-22 15.5 31)" fill="#EBA222"/>
  <ellipse cx="48.5" cy="31" rx="13.2" ry="8.4" transform="rotate(22 48.5 31)" fill="#EBA222"/>

  <!-- Abdomen -->
  <path d="M32 20.5 C44.5 20.5 47.2 33 32 56.8 C16.8 33 19.5 20.5 32 20.5 Z" fill="#111111"/>

  <!-- Stripes (upper band thicker) -->
  <path d="M21.2 31.2 C26.4 28.6 37.6 28.6 42.8 31.2 L41.6 36.4 C36.6 33.9 27.4 33.9 22.4 36.4 Z" fill="#EBA222"/>
  <path d="M23.6 40.6 C28 38.8 36 38.8 40.4 40.6 L39.6 44.2 C35.4 42.6 28.6 42.6 24.4 44.2 Z" fill="#EBA222"/>

  <!-- Head -->
  <ellipse cx="32" cy="16.6" rx="7.4" ry="8.2" fill="#111111"/>

  <!-- Antennae -->
  <g fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round">
    <path d="M28.6 10.2 C26.2 5.2 22.4 3.2 18.6 3.6"/>
    <path d="M35.4 10.2 C37.8 5.2 41.6 3.2 45.4 3.6"/>
  </g>
</svg>
