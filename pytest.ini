[pytest]
markers =
    integration: integration test
    timeout: test with timeout
    e2e_visual: browser-driven golden-journey visual checks (opt-in via RUN_E2E_VISUAL=1; see tests/e2e_visual/)

DJANGO_SETTINGS_MODULE = swarm.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
pythonpath = src tests
# --- Global test timeout for all tests (override with @pytest.mark.timeout or --timeout=X) ---
# Use pytest-timeout plugin (ensure installed)
# Add default options: show extra summary, enable coverage
# Coverage configuration is defined in [tool.coverage.*] in pyproject.toml.
# There is deliberately NO --cov-fail-under here. It used to be
# `--cov-fail-under=0`, which silently overrode pyproject's `fail_under = 70`
# on every run: the two gates could never both bite, and the declared 70% was
# fiction (a reader of pyproject believed in a floor; the CLI gave 0%).
# The one authoritative floor is scripts/coverage_ratchet.py against
# scripts/coverage-ratchet-baseline.txt, run over a FULL-suite report -- see
# that file's header for why a per-run scalar was the wrong shape.
# tests/core/test_coverage_ratchet.py fails if either knob comes back.
addopts = -ra --cov=src/swarm --cov-report=term-missing
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
; DJANGO_ALLOW_ASYNC_UNSAFE is set by scripts/run_tests.py to avoid relying on pytest-env

; D-07: this file is the SINGLE source of pytest config. It used to compete
; with a [tool.pytest.ini_options] block in pyproject.toml, which pytest
; silently ignored (it prints "WARNING: ignoring pytest config in
; pyproject.toml!"). Keys that lived only in the dead block were therefore
; not applied. tests/core/test_pytest_config_single_source.py fails if a
; second config source reappears.
env =
    D:DJANGO_DEBUG = true
    ; #1335: settings.py calls load_swarm_dotenv() at module scope, before
    ; any fixture can redirect HOME, so without this the developer's real
    ; ~/.config/swarm/.env is injected into the run -- ~137 tests 403 and the
    ; suite executes against live operator credentials. tests/conftest.py
    ; also sets it via os.environ.setdefault as a second line of defence.
    D:SWARM_SKIP_DOTENV = true
    ; Django's async-unsafe guard. Was only in the dead pyproject block, so
    ; every bare `uv run pytest` was running without it.
    D:DJANGO_ALLOW_ASYNC_UNSAFE = true
    D:API_AUTH_TOKEN = 
    D:SWARM_API_KEY = 
    D:API_AUTH_TOKENS = 
    D:SWARM_API_KEYS = 

# Filter out external deprecation warnings from dependencies
filterwarnings =
    # Ignore pkg_resources warnings from docutils and pkg_resources itself
    ignore:pkg_resources is deprecated as an API:DeprecationWarning:docutils.*:
    ignore:pkg_resources is deprecated as an API:DeprecationWarning:pkg_resources.*:
    ignore:Deprecated call to `pkg_resources.declare_namespace.*:DeprecationWarning:pkg_resources.*:
    # You might need to add more specific filters if other warnings appear

    # Was only in the dead pyproject block (D-07), so it was never applied --
    # which is the only reason its stale category did not break the suite.
    # pytest-django still applies marks to fixtures, and pytest renamed the
    # warning class across 9 -> 10, so pin the MESSAGE and leave the category
    # empty: naming a class that this pytest does not have is a hard config
    # parse error, not a warning.
    ignore:Marks applied to fixtures have no effect::

# Treat xfail as strict so unexpected passes are surfaced as failures (improves signal)
xfail_strict = true

# Optional: Add markers for better organization if needed later
# markers =
#     slow: marks tests as slow (deselect with '-m "not slow"')
#     integration: marks integration tests
#     serial

# Optional: Configure logging levels for tests
log_cli = true
log_cli_level = INFO
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s - %(message)s (%(filename)s:%(lineno)s)"
log_file = pytest.log
log_file_level = DEBUG
log_file_format = "%(asctime)s [%(levelname)8s] %(name)s - %(message)s (%(filename)s:%(lineno)s)"

# --- Hang guard (D-07) --------------------------------------------------------
# This was commented out with "enable if we observe hangs in CI". We observe
# them: only ONE CI job passed --timeout=180, so a hang in the main job hung CI
# with no ceiling. 600s is a HANG guard, not a performance budget -- the entire
# suite runs in ~570s, so no legitimate test approaches it. Individual tests
# that need tighter control already carry @pytest.mark.timeout(N); tighten
# those, not this. `timeout` is registered in `markers` above, so if the
# pytest-timeout plugin were ever missing the marks would fail SILENTLY rather
# than loudly -- tests/core/test_pytest_config_single_source.py asserts the
# plugin is installed and the guard is active.
timeout = 600
