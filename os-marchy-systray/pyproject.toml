[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "os-marchy-systray"
version = "0.1.0"
description = "Operating Swarm agents in the desktop systray — rig/team grouped, local or remote OS."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Operating Swarm" }]
dependencies = [
    # Thin read-only HTTP client over the existing OS REST surface.
    "httpx>=0.25",
]

[project.optional-dependencies]
# GUI is optional: the core (client/discovery/model/config) imports without it.
tray = [
    "pystray>=0.19",
    "Pillow>=10",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
os-marchy-systray = "os_marchy_systray.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["os_marchy_systray"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test probes deliberately accept fixed pystray/prober signatures.
"tests/*" = ["ARG001", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
