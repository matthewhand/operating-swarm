name: REQ-138 session hop

on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest hop suite
        run: |
          uv run pytest \
            tests/core/test_cli_session_hop.py \
            tests/views/test_cli_session_hop_api.py \
            tests/unit/test_req138_session_hop.py \
            tests/core/test_cli_catalog.py \
            tests/blueprints/test_cli_agent.py -k hop
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest hop suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/cliSessionHop.test.ts \
            src/components/__tests__/CliSessionPicker.test.tsx
          npx vitest run src/pages/__tests__/ChatPage.test.tsx -t "REQ-46"
