name: REQ-171C-4 one CLI session store
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest C-H7 one CLI session store
        run: |
          uv run pytest \
            tests/core/test_cli_resume_argv.py \
            tests/core/test_session_policy.py \
            tests/core/test_cli_catalog.py \
            tests/core/test_cli_untrusted_argv.py \
            tests/views/test_chat_thread_on_mode.py \
            tests/test_consumers_on_mode.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
