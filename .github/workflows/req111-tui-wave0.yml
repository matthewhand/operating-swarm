name: REQ-111 TUI Wave 0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest REQ-111 Wave 0
        run: |
          uv run pytest \
            tests/unit/test_adr012_swarm_cli_tui.py \
            tests/unit/test_tui_client.py \
            tests/unit/test_tui_layout.py \
            tests/cli/test_tui_command.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
