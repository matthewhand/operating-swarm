name: Visual Regression
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# Golden-journey browser suite (tests/e2e_visual). Exists because a green
# build has shipped an unstyled UI twice (Tailwind v4 emitting a 2kB CSS
# bundle; DaisyUI 5 removing `card-bordered`). Unit tests can't see computed
# styles, so this job builds the real frontend, boots the real dev server,
# and asserts on what Chromium actually renders.
#
# Kept separate from python-pytest.yml so the unit-test matrix stays fast and
# does not need browsers or a frontend build.

on:
  workflow_dispatch:

jobs:
  golden-journey:
    # #1730 claim B: this job used to be `if: false`, behind a HOLD note saying
    # "screenshots/tour lock stale -- re-enable after smash / PNG recapture".
    # That justification was wrong on both counts:
    #
    #   * There are no golden images. tests/e2e_visual/test_golden_journey.py
    #     has 6 computed-style / behavioural assertions and no
    #     toHaveScreenshot; the only PNGs are *failure* screenshots written to a
    #     gitignored artifacts/. There was nothing to recapture.
    #   * The suite is green. Verified on this tree: 5 passed, 1 skipped, where
    #     the skip states its own reason (the SPA dark-mode toggle is not on the
    #     Django-canonical / shell, so the theme assertion is N/A there).
    #
    # An `if: false` job whose stated blocker no longer exists is worse than no
    # job: every future reader sees a gate and assumes it fires. The HOLD is
    # lifted and the job runs.
    #
    # Still workflow_dispatch only, deliberately. This repo has a documented
    # exhausted GitHub Actions budget (#1346, see scripts/ci_gates.py), and a new
    # always-on PR trigger cannot be verified from a workstation. What is removed
    # is the part that was a lie -- the disabled job. What remains is an honest,
    # runnable-on-demand browser gate. Adding the pull_request trigger is a
    # one-line change once Actions budget is restored.
    #
    # Provenance, so a future reader does not swap one gate for the other: this
    # HOLD was placed by REQ-89 during a merge-smash flush. Vitest (npm test)
    # remains the automatic SPA PR gate in python-pytest.yml (REQ-171C-7 /
    # #616) -- re-enabling this job does not replace that, and it is not a way to
    # recover SPA unit coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Build frontend (webui/frontend/dist)
        working-directory: webui/frontend
        run: |
          npm ci
          npm test
          npm run build
          # Fail loudly here too if the bundle is suspiciously small.
          ls -l dist/assets/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Install Playwright Chromium
        run: uv run playwright install chromium --with-deps

      - name: Run golden-journey visual suite
        run: uv run pytest tests/e2e_visual -q
        env:
          RUN_E2E_VISUAL: "1"
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-failure-screenshots
          path: tests/e2e_visual/artifacts/
          if-no-files-found: ignore
          retention-days: 14
