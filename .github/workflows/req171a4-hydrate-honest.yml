name: REQ-171A-4 hydrate chat threads honestly

on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: REQ-171A-4 pytest (own-diff)
        run: |
          uv run pytest \
            tests/unit/test_req171a4_hydrate_honest.py \
            tests/views/test_chat_retention.py \
            -k "req171a4 or patch_cli_and_remote_threads_are_forbidden"
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest REQ-171A-4 suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/agentChat.test.ts \
            src/pages/__tests__/ChatPage.hydrate.test.tsx
