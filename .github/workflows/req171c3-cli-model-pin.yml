name: REQ-171C-3 CLI/API model pin
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest REQ-171C-3
        run: |
          uv run pytest \
            tests/core/test_req171c3_cli_model_pin.py \
            tests/core/test_cli_models.py \
            tests/core/test_cli_catalog.py \
            tests/core/test_cli_catalog_model_pinning.py \
            tests/core/test_cli_mcp.py \
            tests/api/test_cli_agents_opt_in.py \
            tests/core/test_req157_cli_agents.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest REQ-171C-3 suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/cliAgentContext.test.ts \
            src/pages/__tests__/ChatPage.cliModelPin.test.tsx \
            src/components/__tests__/NavbarRoutingPicker.test.tsx \
            src/components/__tests__/AgentEditor.test.tsx
