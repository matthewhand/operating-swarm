name: Plugins popup (#805)

# Own-diff CI: only the #805 sort / toggle persist / search tests plus the
# per-chat allowlist helper. Not the full Python matrix.

on:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest sort / toggle persist / search (#805)
        working-directory: webui/frontend
        run: >
          npx vitest run
          src/lib/__tests__/chatPluginTools.test.ts
          src/lib/__tests__/chatScope.test.ts
          src/lib/__tests__/mcpServers.test.ts
          src/components/__tests__/PluginsPopup.test.tsx

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Plugin allowlist unit tests
        run: uv run pytest tests/core/test_chat_plugin_tools.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
