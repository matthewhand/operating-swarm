name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Build ADR-001 SPA (make frontend)
        run: ./scripts/build_frontend.sh

      - name: Confirm dist/index.html
        run: test -f webui/frontend/dist/index.html

      - name: Install Playwright Chromium
        working-directory: webui/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright chat-send mock inference (REQ-13)
        working-directory: webui/frontend
        run: npx playwright test e2e/chat-send.spec.ts
        env:
          CI: true

  # REQ-171C-7 / C-H9 / #616: SPA contract tests must gate PRs. Visual
  # golden-journey stays HOLD (REQ-89) — do not recover Vitest by flipping
  # visual-regression.yml. Source-grep REQ locks are not this job.
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest SPA contract tests
        working-directory: webui/frontend
        run: npm test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Support the current stable line only: floor 3.12 + latest stable 3.13.
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (used by MCP-server test fixtures)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
        # REQ-123: pytest stays on SQLite (no live Neon). See docs/DATABASE.md.

  # REQ-123 / #508: migrate smoke against a local Postgres service — not Neon.
  postgres-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm -d swarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Migrate against local Postgres
        run: uv run python manage.py migrate --noinput
        env:
          DJANGO_DEBUG: "true"
          DATABASE_URL: postgres://swarm:swarm@localhost:5432/swarm
