name: Python Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Playwright e2e and per-REQ own-diff workflows are workflow_dispatch only
  # (Actions budget / #250). Vitest remains the SPA PR gate (REQ-171C-7).
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest SPA contract tests
        working-directory: webui/frontend
        run: npm test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PR #899 port: pyproject declares 3.12 + 3.13 — CI tests both.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (used by MCP-server test fixtures)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: "Gate: Sanitize tracked files against sensitive LAN IPs and hostnames"
        run: uv run pytest tests/test_tracked_files_sanitization.py --no-cov

      - name: Run tests
        run: uv run pytest
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
        # REQ-123: pytest stays on SQLite (no live Neon). See docs/DATABASE.md.

  # REQ-123 / #508: migrate smoke against a local Postgres service — not Neon.
  postgres-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm -d swarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Migrate against local Postgres
        run: uv run python manage.py migrate --noinput
        env:
          DJANGO_DEBUG: "true"
          DATABASE_URL: postgres://swarm:swarm@localhost:5432/swarm
