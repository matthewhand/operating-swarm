name: REQ-213 compacted-card menu

on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest REQ-213 source lock
        run: uv run pytest tests/unit/test_req213_compacted_card_menu.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest REQ-213 suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/compactedCardMenu.test.ts \
            src/components/__tests__/CompactedCardContextMenu.test.tsx \
            src/components/__tests__/CompactSummaryCard.test.tsx \
            src/components/__tests__/SystemPreloadPill.test.tsx \
            src/components/__tests__/ChatMessageBubble.test.tsx \
            src/components/AgentChat/__tests__/AgentMessageBubble.test.tsx \
            src/pages/__tests__/ChatPage.compactedCardMenu.test.tsx
