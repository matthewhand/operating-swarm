name: REQ-171A-2 persist on assistant final

on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: REQ-171A-2 pytest (own-diff)
        run: |
          uv run pytest \
            tests/unit/test_req171a2_persist_on_final.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
