name: REQ-203 Remote harness spec
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: REQ-203 pytest (own-diff)
        run: |
          uv run pytest \
            tests/core/test_req203_remote_harness.py \
            tests/core/test_agent_kind.py \
            tests/core/test_agent_types.py \
            tests/unit/test_adr011_remote_harness.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
