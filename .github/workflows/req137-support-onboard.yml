name: REQ-137 Support journey onboard
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: REQ-137 pytest (own-diff)
        run: |
          uv run pytest \
            tests/unit/test_req137_support_onboard.py \
            tests/blueprints/test_support.py \
            tests/core/test_support_agent.py \
            tests/core/test_support_journey.py \
            tests/core/test_suggestions.py \
            tests/views/test_suggestions_api.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest REQ-137 suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/supportJourney.test.ts \
            src/lib/__tests__/support-briefing.test.ts \
            src/lib/__tests__/supportAgent.test.ts \
            src/pages/__tests__/ChatPage.supportOnboard.test.tsx
          npx vitest run src/pages/__tests__/AgentRouterPage.test.tsx \
            -t "quickstart pills start the journey"
