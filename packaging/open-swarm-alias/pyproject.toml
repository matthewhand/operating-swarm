[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-swarm"
version = "0.5.5"
description = "Deprecated alias for Operating Swarm. Installs os-core; this is not the product."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Matthew Hand", email = "matthewhandau@gmail.com" },
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "os-core",
]

[project.urls]
Homepage = "https://github.com/matthewhand/operating-swarm"
Documentation = "https://github.com/matthewhand/operating-swarm/blob/main/README.md"
Repository = "https://github.com/matthewhand/operating-swarm.git"
Changelog = "https://github.com/matthewhand/operating-swarm/blob/main/CHANGELOG.md"

# Meta-package: no modules, no console scripts (os-cli lives on os-core).
[tool.hatch.build.targets.wheel]
bypass-selection = true
