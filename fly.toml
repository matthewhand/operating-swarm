# fly.toml app configuration file generated for open-swarm on 2025-01-17T22:46:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'open-swarm'
primary_region = 'syd'

[build]
  # Build from local Dockerfile so LiteLLM base_url / master-key client fixes ship.
  # (Previously pinned to prebuilt mhand79/open-swarm:latest which lagged the repo.)
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  SWAPFILE_PATH = "/mnt/sqlite_data/swapfile"
  # #1337: runtime reservation on the shared 1GB volume (384M; was a fixed 768M).
  # A [build.args] entry never reached the shell CMD. scripts/ensure_swapfile.sh
  # reads this value and replaces a larger file already on the volume.
  SWAP_SIZE_MB = '384'
  # TLS is terminated at the Fly proxy and the VM is not directly reachable,
  # so trusting X-Forwarded-Proto is correct here (issue #1345). Required:
  # without it Django builds the OAuth redirect_uri with an http:// scheme
  # and GitHub/Google reject the callback. docker-compose and the systemd
  # units publish 8000 directly and correctly leave this unset.
  SWARM_BEHIND_TLS_PROXY = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1 
  processes = ['app']

# Liveness via AllowAny /health (urls.py HealthCheckView). Verified live on
# open-swarm.fly.dev (200 {"status":"ok"}); re-enabled after the 2026-06-20
# disable that avoided fly-proxy blackholing /v1 while the image lacked /health.
[[http_service.checks]]
  grace_period = "120s"
  interval = "30s"
  timeout = "15s"
  method = "GET"
  path = "/health"
  [http_service.checks.headers]
    Host = "open-swarm.fly.dev"

[deploy]
wait_timeout = "20m"    # Increase from default 5m
release_command_timeout = "10m"  # For DB migrations/pre-deploy tasks

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source="sqlite_data"
  destination="/mnt/sqlite_data"

