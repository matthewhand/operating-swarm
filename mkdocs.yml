# Open Swarm SDK reference (REQ-857 / #857)
#
# Build:  uv run mkdocs build --strict
# Serve:  uv run mkdocs serve
#
# The reference pages are generated by `scripts/gen_sdk_reference.py` from
# the module registry below — add a module there and rebuild; the nav stays
# in sync because this file's API section is also generated.

site_name: Open Swarm SDK
site_description: Blueprint SDK reference — base classes, sandbox harnesses, roles, remote adapters, and the Herdr SSH layer.
repo_url: https://github.com/matthewhand/open-swarm-private
docs_dir: docs
# #857: strict-ish validation — hard failures abort the build; the legacy
# docs' pre-existing anchor-link warnings are downgraded to info so the new
# SDK reference cannot rot while history is cleaned up at leisure.
validation:
  omitted_files: warn
  absolute_links: warn
  anchors: info
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
nav:
  - SDK home: sdk/BLUEPRINT_SDK.md
  - Reference:
      - Overview: sdk/reference/index.md
      - Sandbox: sdk/reference/sandbox.md
      - Roles: sdk/reference/roles.md
      - Remote adapters: sdk/reference/remotes.md
      - Herdr SSH: sdk/reference/herdr_ssh.md
