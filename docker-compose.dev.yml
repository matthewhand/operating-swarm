# Open Swarm — DEV override: bind-mount source + uvicorn --reload.
#
# WHAT THIS DOES
#   Bind-mounts the repo over /app and overrides the image CMD so uvicorn runs
#   with --reload (single process; --reload is incompatible with multi-worker).
#   The production image CMD is uvicorn WITHOUT --reload — a mount alone does
#   not auto-restart. Python edits under src/ are picked up via PYTHONPATH;
#   rebuild still needed for dependency / Dockerfile changes.
#
# PORT
#   Publishes on host :8002 to avoid the busy ports on the open-swarm-oracle
#   host (8000=netbox, 8001=native open-swarm, 8765=mcp-gateway bridge). Hit the
#   dev server directly at http://localhost:8002. This does NOT touch the native
#   :8001 service that mcp-gateway proxies — dev and prod run side by side.
#
# USAGE
#   make dev
#   # or explicitly (note: -f list skips the auto-merged production override):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# NOTE
#   Same ASGI path as production (uvicorn → swarm.asgi), so websockets work.
#   CLI blueprints need the host-coupled docker-compose.override.yml mappings,
#   which the explicit -f list above intentionally does not load.

services:
  swarm:
    # !override replaces the base `ports` list rather than appending to it —
    # without it Compose merges sequences and the base 8000:8000 would still
    # bind (and collide with whatever holds :8000 on the host).
    ports: !override
      - "8002:8000"
    # Dev only. The base file caps `swarm` at `restart: on-failure:5` so a
    # permanently-unusable DATABASE_URL (e.g. Neon quota) fails fast instead of
    # crash-looping — see docs/RUNBOOK_NEON_QUOTA_CRASH_LOOP.md. This overlay's
    # database is the compose-local Postgres (itself `unless-stopped`), so it
    # self-heals instead: a LAN endpoint that comes back on its own is worth
    # more here than fail-fast. Do NOT pair this overlay with a cloud
    # DATABASE_URL and expect the cap to protect you.
    restart: unless-stopped
    # Image CMD is migrate-then-uvicorn without --reload. Override so saves under
    # the bind-mount restart the ASGI app. --reload requires a single process.
    # Port 8000 is the in-container listen port (host maps 8002:8000). The
    # merged environment still points at the base-file `postgres` service
    # (DATABASE_URL / POSTGRES_*). SQLite is not the compose happy path.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        python manage.py migrate --fake-initial
        echo "--- Starting Open Swarm ASGI (uvicorn --reload) ---"
        exec uvicorn swarm.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-include '*.py'
    volumes:
      # Live source tree. hatchling installs into site-packages (no src/
      # open_swarm.egg-info), so PYTHONPATH below is what makes this mount win.
      - ".:/app"
    environment:
      # Local dev: enables Django DEBUG (also drops the production
      # DJANGO_SECRET_KEY requirement) and surfaces tracebacks.
      DJANGO_DEBUG: "true"
      DJANGO_LOG_LEVEL: "DEBUG"
      SWARM_LOG_LEVEL: "DEBUG"
      # --reload cannot share the process with multiple workers.
      SWARM_UVICORN_WORKERS: "1"
      # CRITICAL for live-reload: the image does `pip install .`, so `import
      # swarm` resolves to the frozen copy in site-packages, NOT the bind-mounted
      # source (the package lives at src/swarm/). Prepending the mounted source
      # to PYTHONPATH makes edits the code that actually runs, so uvicorn's
      # reloader picks them up.
      PYTHONPATH: "/app/src"
      # REQ-45: dev sandbox. HOME is injected and swarm state dirs are mapped
      # from the host (see base compose). Treat as sandbox-home (warning banner),
      # not a green isolated box. Override SWARM_RUNTIME_MODE=sandbox-isolated
      # if you drop those mounts. Map $HOME or SWARM_SANDBOX_ROOT for a full tree.
      SWARM_RUNTIME_MODE: "${SWARM_RUNTIME_MODE:-sandbox-home}"
